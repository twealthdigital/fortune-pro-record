<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Allow camera</title>
  <style>
    body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#f5f2ee;font-family:Inter,system-ui,sans-serif;}
    .card{max-width:420px;text-align:center;padding:2rem;border:1px solid #ff6b00;border-radius:1.2rem;background:#141414;}
    h1{margin:0 0 .6rem;font-size:1.3rem;color:#ff6b00;}
    p{margin:0 0 1.2rem;line-height:1.5;}
    button{cursor:pointer;font-weight:700;border-radius:999px;padding:.7rem 1.4rem;border:1px solid #ff6b00;background:#ff6b00;color:#000;font-size:.9rem;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Fortune Cam Bubble</h1>
    <p id="msg">Allow your camera once and the bubble will work on every tab.</p>
    <button id="allow">Allow camera</button>
  </div>
  <script src="permission.js"></script>
</body>
</html>
